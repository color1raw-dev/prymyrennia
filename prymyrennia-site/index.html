*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
b{font-weight:500}

/* shell */
.shell{position:relative;display:grid;grid-template-columns:244px minmax(0,1fr);gap:32px;min-height:100%;max-width:1500px;margin:0 auto;padding-inline:clamp(16px,2.2vw,32px)}
html,body{overflow-x:hidden;overflow-x:clip;max-width:100%}
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;width:74vmax;height:74vmax;border-radius:50%;opacity:var(--fx-o);will-change:transform,opacity;
  background:radial-gradient(closest-side,var(--c) 0%,color-mix(in srgb,var(--c) 55%,transparent) 38%,color-mix(in srgb,var(--c) 16%,transparent) 68%,transparent 100%)}
.bgfx i:nth-child(1){--c:#f5a623;top:-34vmax;right:-14vmax;animation:fxa 52s ease-in-out infinite alternate}
.bgfx i:nth-child(2){--c:#a9d94f;bottom:-40vmax;left:-24vmax;animation:fxb 64s ease-in-out infinite alternate}
.bgfx i:nth-child(3){--c:#ff7ba6;top:18%;right:-42vmax;animation:fxc 71s ease-in-out infinite alternate}
.bgfx i:nth-child(4){--c:#8fb6d1;top:-44vmax;left:4%;animation:fxd 83s ease-in-out infinite alternate}
@keyframes fxa{0%{transform:translate(0,0) scale(1,1) rotate(0deg)}50%{transform:translate(-22vw,12vh) scale(1.28,.82) rotate(50deg);opacity:calc(var(--fx-o)*.55)}100%{transform:translate(-44vw,30vh) scale(.86,1.22) rotate(110deg)}}
@keyframes fxb{0%{transform:translate(0,0) scale(1.1,.9) rotate(0deg)}50%{transform:translate(26vw,-14vh) scale(.84,1.24) rotate(-60deg)}100%{transform:translate(52vw,-6vh) scale(1.2,.9) rotate(-120deg);opacity:calc(var(--fx-o)*.5)}}

.dcard::after{content:"";position:absolute;z-index:-1;left:20px;right:20px;bottom:16px;height:13px;background-image:radial-gradient(circle,rgba(255,255,255,.6) 1px,transparent 1.5px);background-size:7px 7px;

body.touring .tour-on{filter:none!important;opacity:1!important}
body.touring #nav{-webkit-mask-image:none;mask-image:none}
/* preloader */
#pre{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4vh,40px);overflow:hidden;transition:opacity .7s ease,visibility .7s}
#pre.out{opacity:0;visibility:hidden;pointer-events:none}
#pre::before{content:"";position:absolute;left:50%;top:50%;width:90vmax;height:90vmax;transform:translate(-50%,-50%);background:radial-gradient(closest-side,color-mix(in srgb,#f5a623 34%,transparent) 0%,color-mix(in srgb,#f6dc6a 14%,transparent) 45%,transparent 100%);animation:preGlow 2.6s ease-out both}
.pre-in{position:relative;flex:none;width:max(118vw,1000px);aspect-ratio:1900/483}
.pre-l,.pre-r{position:absolute;top:0;width:50%;height:100%;background-image:var(--hands);background-repeat:no-repeat;background-size:200% 100%}
.pre-l{left:0;background-position:left center;animation:preL 2.4s cubic-bezier(.16,.84,.24,1) both}
.pre-r{right:0;background-position:right center;animation:preR 2.4s cubic-bezier(.16,.84,.24,1) both}
.pre-in::after{content:"";position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%) scale(.2);border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.95) 0%,rgba(246,220,106,.55) 30%,transparent 100%);opacity:0;animation:preSpark 1.5s ease-out 1.7s both}
.pre-w{position:relative;text-align:center;font-size:clamp(30px,5vw,46px);font-weight:500;letter-spacing:-.045em;line-height:1;animation:preW 1.1s ease-out 1.3s both}
.pre-w small{display:block;font-size:13px;font-weight:400;letter-spacing:0;color:var(--muted);margin-top:10px}
@keyframes preL{0%{transform:translate(-22%,6%);opacity:0}35%{opacity:1}100%{transform:translate(0,0);opacity:1}}
@keyframes preR{0%{transform:translate(22%,-6%);opacity:0}35%{opacity:1}100%{transform:translate(0,0);opacity:1}}
@keyframes preSpark{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}35%{opacity:.9}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
@keyframes preW{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
@keyframes preGlow{0%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.pre-l,.pre-r,.pre-w,#pre::before{animation:none}.pre-in::after{display:none}}
/* assistant */
.ai-orb{width:34px;height:34px;border-radius:50%;flex:none;background:radial-gradient(60% 60% at 40% 40%,#f7b521 0%,transparent 72%),radial-gradient(90% 90% at 100% 100%,#ff2f74 0%,transparent 60%),radial-gradient(80% 80% at 0% 100%,#7ac943 0%,transparent 62%),#ee8a28}
#aiFab{position:fixed;z-index:20;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 14px 40px rgba(0,0,0,.22);display:grid;place-items:center;cursor:pointer;padding:0;color:#fff;transition:transform .2s}
#aiFab:hover{transform:scale(1.06)}
#aiFab .ai-orb{width:48px;height:48px;grid-area:1/1}
#aiFab svg.i{grid-area:1/1;width:22px;height:22px;vertical-align:0}
#aiPanel{position:fixed;z-index:21;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(410px,calc(100vw - 32px));height:min(640px,calc(100% - 32px));display:flex;flex-direction:column;border-radius:34px;background:var(--surface);border:1px solid var(--glass-line);box-shadow:0 30px 90px rgba(0,0,0,.3);overflow:hidden}
.ai-h{display:flex;align-items:center;gap:12px;padding:16px 16px 12px 18px}
.ai-h .grow{display:flex;flex-direction:column;line-height:1.25;flex:1 1 auto}
.ai-h b{font-size:16px}
.ai-m{flex:1 1 auto;min-height:0;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:8px}
.ai-b{max-width:88%;padding:11px 15px;border-radius:22px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;line-height:1.45}
.ai-b.u{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:8px}
.ai-b.a{align-self:flex-start;background:var(--raise);border-bottom-left-radius:8px}
.ai-b.wait{color:var(--muted)}
.ai-b.err{color:var(--bad)}
.ai-act{align-self:flex-start;display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 12px;border-radius:99px;background:var(--lime);color:var(--lime-fg)}
.ai-act.bad{background:var(--bad-bg);color:var(--bad)}
.ai-act svg.i{width:14px;height:14px;vertical-align:0}
.ai-act .link{color:inherit;text-decoration-color:currentColor}
.ai-l{align-self:stretch;display:flex;flex-direction:column;gap:4px}
.ai-p{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;width:100%;min-height:48px;padding:8px 12px 8px 16px;border:0;border-radius:18px;background:var(--raise);color:inherit;font:inherit;text-align:left;cursor:pointer}
.ai-p b{font-weight:500;font-size:14.5px;grid-column:1}
.ai-p span{grid-column:1;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.ai-p svg.i{grid-column:2;grid-row:1/span 2;width:16px;height:16px;color:var(--muted)}
.ai-p:hover{filter:brightness(.97)}
.ai-hc .chip{height:auto;min-height:36px;padding:7px 14px;white-space:normal;text-align:left;border-color:var(--line)}
.ai-e{margin:auto 0;display:flex;flex-direction:column;gap:10px;padding:8px 4px}
.ai-e b{font-size:20px;font-weight:400;letter-spacing:-.025em;line-height:1.2}
.ai-e .chips{margin-top:8px}
.ai-e .chip{height:auto;min-height:38px;padding:8px 15px;white-space:normal;text-align:left;border-color:var(--line)}
.ai-f{display:flex;gap:8px;padding:10px 12px 14px;align-items:center}
.ai-f input{flex:1;height:48px;border-color:var(--line)}
.iconbtn.inv{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);width:48px;height:48px}
@media (max-width:920px){
  .wm{display:flex;align-items:baseline;gap:10px;font-size:24px;padding:0}
  .wm small{margin:0}
}

function start(){
  var h=(location.hash||"").slice(1);if(TITLES[h])S.tab=h;
  try{var sr=JSON.parse(localStorage.getItem("rep")||"null");if(Array.isArray(sr))S.rep=sr.filter(function(k){return REPORTS.some(function(r){return r[0]===k})})}catch(e){}
  render();
  var use=window.claude&&window.claude.use?window.claude.use.bind(window.claude):function(){return Promise.resolve(null)};
  Promise.all([use("db"),use("user")]).then(function(r){
    rdb=r[0];var user=r[1];USER=user;db=rdb?wrapDb(rdb):null;
    if(!db){app.innerHTML='<div class="panel empty">Дані недоступні в цьому перегляді. Увійдіть у свій обліковий запис і відкрийте сторінку ще раз.</div>';return}
    if(user&&user.me)Promise.resolve(user.me()).then(function(m){S.me=m||null;S.uid=m&&m.id||null;S.isOwner=!!(m&&m.isOwner);S.isAdmin=!!(m&&(m.canEdit||m.isOwner));S.roleKnown=true;if(S.uid&&rdb)rdb.doc("log/"+S.uid).set({seen:Date.now()}).catch(function(){});if(S.isAdmin)subLog();render()});
    if(user&&user.can)Promise.resolve(user.can("data.write")).then(function(c){if(c===false){S.canWrite=false;render()}});
    db.collection("people").limit(1000).onSnapshot(function(snap){S.people=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});S.ready=true;render()},function(){app.innerHTML='<div class="panel empty">Не вдалося завантажити дані. Оновіть сторінку.</div>'});
    db.collection("reminders").limit(500).onSnapshot(function(snap){S.rem=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});if(S.ready)render()},function(){});
    db.collection("groups").limit(500).onSnapshot(function(snap){S.groups=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});if(S.ready)render()},function(){});
    db.collection("meetings").limit(1000).onSnapshot(function(snap){S.meetings=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});if(S.ready)render()},function(){});
    db.collection("annual").limit(200).onSnapshot(function(snap){S.annual={};snap.docs.forEach(function(d){S.annual[d.id]=d.data()});if(S.ready)render()},function(){});
    db.collection("gmeet").limit(1000).onSnapshot(function(snap){S.gmeet=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});if(S.ready)render()},function(){});
    db.collection("archive").limit(200).onSnapshot(function(snap){S.archive={};snap.docs.forEach(function(d){S.archive[d.id]=d.data()});if(S.ready)render()},function(){});
    db.doc("config/main").onSnapshot(function(s){var c=s.exists?s.data():{};S.cfg=c;S.min={};Object.keys(c.ministries||{}).forEach(function(k){if(Array.isArray(c.ministries[k])&&c.ministries[k].length)S.min[k]=c.ministries[k].slice()});S.customRoles=Array.isArray(c.customRoles)?c.customRoles.slice():[];S.dk=(Array.isArray(c.deacons)?c.deacons:[]).map(function(d){return typeof d==="string"?{pid:"",name:d,aliases:[]}:{pid:d.pid||"",name:d.name,aliases:d.aliases||[]}});ALIAS={};S.dk.forEach(function(d){d.aliases.forEach(function(a){ALIAS[a]=d.name})});S.deacons=S.dk.map(function(d){return d.name});S.pastors=Array.isArray(c.pastors)?c.pastors.slice():(c.pastor?[c.pastor]:[]);if(S.ready)render()},function(){});
  });
}

function aiAsk(q){q=String(q||"").trim();if(!q||AI.busy)return;var r=null;try{r=aiLocal(q)}catch(e){r=null}
  if(!aiLoc()&&!(r&&r.kind==="act"))return aiAskAI(q);

  el.innerHTML='<div class="ai-h"><span class="ai-orb"></span><span class="grow"><b>Помічник</b><span class="muted small">'+(loc?"шукає і записує за командою":"знає все, що є в обліку")+'</span></span>'+(AI.log.length?'<button class="iconbtn" data-act="aiClear" aria-label="Очистити чат" title="Очистити чат">'+ico("trash")+'</button>':"")+'<button class="iconbtn" data-act="aiOpen" aria-label="Закрити чат">'+ico("x")+'</button></div>'+
    '<div class="ai-m" id="aiMsgs">'+(AI.log.length?AI.log.map(function(m,i){var last=i===AI.log.length-1;
      if(m.r==="act")return '<div class="ai-act'+(m.bad?" bad":"")+'">'+ico(m.bad?"alert":"check")+'<span>'+esc(m.t)+'</span>'+(m.id&&person(m.id)?'<button class="link" data-act="open" data-id="'+esc(m.id)+'">відкрити</button>':"")+'</div>';
      if(m.r==="ppl")return '<div class="ai-l">'+m.l.map(function(p){return '<button class="ai-p" data-act="open" data-id="'+esc(p.id)+'"><b>'+esc(p.t)+'</b>'+(p.s?'<span>'+esc(p.s)+'</span>':"")+ico("arrow")+'</button>'}).join("")+'</div>';
      if(m.r==="help")return '<div class="chips ai-hc">'+LC_HELP.map(function(s0){return '<button class="chip" data-act="aiSug">'+esc(s0)+'</button>'}).join("")+'</div>';

      '<div class="ai-e"><b>'+(loc?"Напишіть, кого знайти або що записати":"Запитайте про будь-кого або попросіть записати")+'</b><span class="muted small">Наприклад: «знайди Бурлаку», «нагадай у суботу подзвонити Вадиму», «запиши: сьогодні відвідав Вадима».</span><div class="chips">'+sug.map(function(s0){return '<button class="chip" data-act="aiSug">'+esc(s0)+'</button>'}).join("")+'</div></div>')+'</div>'+
    '<form class="ai-f" id="aiForm"><input id="aiIn" placeholder="'+(loc?"Команда або запитання…":"Ваше запитання…")+'" aria-label="Запитання до помічника" autocomplete="off"'+(AI.busy?" disabled":"")+'>'+(AI.busy&&AI.ctl?'<button type="button" class="iconbtn inv" data-act="aiStop" aria-label="Зупинити">'+ico("stop")+'</button>':'<button type="submit" class="iconbtn inv" aria-label="Надіслати">'+ico("send")+'</button>')+'</form>';
  var ni=document.getElementById("aiIn");if(!AI.busy){ni.value=kv;if(foc)ni.focus()}var ms=document.getElementById("aiMsgs");ms.scrollTop=ms.scrollHeight}
