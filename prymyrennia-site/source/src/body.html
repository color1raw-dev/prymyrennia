<body>
<title>Церковний облік</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Serif:wght@700&display=swap">
<style>
/* Layout: pine sidebar with sections, working area on the right; a person opens in a side drawer with a timeline of events. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --fg:#15201d; --muted:#5a6965; --line:#d8e0dd; --accent:#1c6b58; --accent-fg:#ffffff; --soft:#e4efeb;
  --side:#123d33; --side-fg:#dcebe6; --side-on:#1f5a4b; --out:#b85c1e; --cin:#0f8a6c; --track:#e9eeec;
  --ok:#1f7a4d; --ok-bg:#dff3e8; --warn:#8a5a00; --warn-bg:#fdeec8; --bad:#a32b2b; --bad-bg:#fbe1e1; --gone:#55606b; --gone-bg:#e6eaee;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif; --display:"PT Serif",Georgia,serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101715; --surface:#18211e; --fg:#e5ecea; --muted:#9aa9a5; --line:#2a3733; --accent:#5cc0a4; --accent-fg:#0d1513; --soft:#1f2f2a;
  --side:#0c2620; --side-fg:#cfe3dc; --side-on:#17463a; --out:#c0763e; --cin:#2f9c80; --track:#232d2a;
  --ok:#7ad6a3; --ok-bg:#173527; --warn:#f0c463; --warn-bg:#3a2d0c; --bad:#f09a9a; --bad-bg:#3d1a1a; --gone:#aab4bd; --gone-bg:#262d33; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101715; --surface:#18211e; --fg:#e5ecea; --muted:#9aa9a5; --line:#2a3733; --accent:#5cc0a4; --accent-fg:#0d1513; --soft:#1f2f2a;
  --side:#0c2620; --side-fg:#cfe3dc; --side-on:#17463a; --out:#c0763e; --cin:#2f9c80; --track:#232d2a;
  --ok:#7ad6a3; --ok-bg:#173527; --warn:#f0c463; --warn-bg:#3a2d0c; --bad:#f09a9a; --bad-bg:#3d1a1a; --gone:#aab4bd; --gone-bg:#262d33; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
aside{background:var(--side);color:var(--side-fg);padding:20px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--display);font-size:20px;padding:0 10px;color:#fff;line-height:1.2}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--side-fg);opacity:.8;margin-top:2px}

nav button:hover{background:var(--side-on)}
nav button[aria-current="page"]{background:var(--side-on);color:#fff}
nav .cnt{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.content{padding:18px 20px 70px;display:flex;flex-direction:column;gap:18px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.topbar h2{font-family:var(--display);font-size:24px;margin:0;flex:1 1 auto}
#app{display:flex;flex-direction:column;gap:18px;min-width:0}
h3{font-size:15px;margin:0;font-weight:600}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:60px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad)} .btn.small{padding:3px 9px;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1 1 220px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.pad{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.scroll{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.kpi .s{font-size:13px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.cols>*{min-width:0}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:14px;padding:3px 4px;border-radius:6px;border:0;background:none;color:inherit;font-family:inherit;text-align:left;width:100%}
button.hbar{cursor:pointer} button.hbar:hover{background:var(--soft)}
.hbar .t{background:var(--track);border-radius:4px;height:12px;overflow:hidden}
.hbar .f{height:100%;background:var(--cin);border-radius:0 4px 4px 0;min-width:2px}
.hbar .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vchart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:18px;border-bottom:1px solid var(--line)}
.vg{flex:1 1 0;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;min-width:0}
.vb{flex:0 1 16px;border-radius:4px 4px 0 0;position:relative;min-height:2px}
.vb.in{background:var(--cin)} .vb.zero{visibility:hidden} .vb.out{background:var(--out)}
.vb span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.vx{display:flex;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.vx div{flex:1 1 0;min-width:0;text-align:center}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
th[data-sort]{cursor:pointer} th[data-sort]:hover{color:var(--fg)}
td.n,th.n{text-align:right}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer} tr.row:hover{background:var(--soft)}
tr.sum td{font-weight:600}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700}
.av.big{width:48px;height:48px;font-size:17px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.s-role{background:var(--soft);color:var(--accent)}
.s-member{background:var(--ok-bg);color:var(--ok)} .s-note{background:var(--warn-bg);color:var(--warn)}
.s-excluded{background:var(--bad-bg);color:var(--bad)} .s-left,.s-moved,.s-died,.s-none{background:var(--gone-bg);color:var(--gone)}
.muted{color:var(--muted)} .small{font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.link{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-align:left}
.link:hover{text-decoration:underline}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.dcard{text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.dcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dcard b{font-size:15px} .dcard .v{font-size:24px;font-weight:700}
.fam{padding:10px 16px;border-bottom:1px solid var(--line)} .fam:last-child{border-bottom:0}
.fam h4{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:600}
.fam ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.badge{background:#d64545;color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;font-variant-numeric:tabular-nums}
.alert{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 14px;font-weight:500}
.rem li{align-items:center;flex-wrap:wrap}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
dialog{border:0;background:var(--surface);color:var(--fg);padding:0;margin:0 0 0 auto;width:min(560px,100vw);height:100%;max-height:100%;border-left:1px solid var(--line)}
dialog::backdrop{background:rgba(8,18,15,.5)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:16px}
.dlg-head{display:flex;gap:12px;align-items:center}
.dlg-head h2{font-family:var(--display);font-size:20px;margin:0;text-wrap:balance}
.dlg-head .x{margin-left:auto;align-self:flex-start}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 16px;margin:0}
.facts div{min-width:0} .facts dt{font-size:12px;color:var(--muted)} .facts dd{margin:0;overflow-wrap:anywhere}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}
.form .wide{grid-column:1/-1}
.box{background:var(--soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
ol.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:14px}
ol.tl li{position:relative;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
ol.tl li::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
ol.tl li.e-out::before{background:var(--out)}
ol.tl .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 15px;border-radius:8px;font-size:14px;z-index:40;max-width:calc(100vw - 32px)}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  aside{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;height:auto;flex-direction:row;align-items:center;padding:8px 12px;gap:10px;overflow-x:auto}
  .brand small{display:none} .brand{font-size:16px;white-space:nowrap;padding:0}
  nav{flex-direction:row} nav button{white-space:nowrap;padding:7px 10px} nav .cnt{display:none}
  .content{padding:14px 16px 70px}
  .hide-s{display:none}
}
#nav button[hidden]{display:none}
.kbtn{font:inherit;color:inherit;text-align:left;cursor:pointer;display:block;width:100%}
.kbtn:hover{border-color:var(--accent);background:var(--soft)}
</style>

<div class="shell">
  <aside>
    <div class="brand">Церковний облік<small>члени, диякони, рух</small></div>
    <nav id="nav">
      <button data-tab="home">Огляд</button>
      <button data-tab="reminders">Нагадування <span class="badge" id="c_rem" hidden></span></button>
      <button data-tab="people">Люди <span class="cnt" id="c_people"></span></button>

      <button data-tab="groups">Малі групи <span class="cnt" id="c_groups"></span></button>
      <button data-tab="meetings">Зібрання <span class="cnt" id="c_meet"></span></button>
      <button data-tab="journal">Рух членства</button>
      <button data-tab="reports">Звіти</button>
      <button data-tab="log" id="navLog" hidden>Журнал змін</button>
    </nav>
    <div id="who" class="small" style="padding:14px 12px 4px;line-height:1.45;color:#fff;opacity:.75"></div>

  <div class="content">

    <main id="app"><div class="panel empty">Завантаження даних…</div></main>
  </div>
</div>
<dialog id="dlg"></dialog>
<div id="tip" hidden></div>
<div id="toast" hidden></div>

<script>
(function(){

  note_off:{label:"Знятий із замітки",st:"member"},excluded:{label:"Вилучений",st:"excluded",out:1},left:{label:"Самоусунувся",st:"left",out:1},moved:{label:"Перейшов до іншої церкви",st:"moved",out:1},died:{label:"Перейшов у вічність",st:"died",out:1}};

var db=null, app=document.getElementById("app"), dlg=document.getElementById("dlg"), CY=new Date().getFullYear();

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fd(iso){if(!iso)return "";var p=String(iso).split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:iso}

function ini(p){return ((p.last||"?")[0]+((p.first||"")[0]||"")).toUpperCase()}

function derive(p){var st="none",dk="",joined="",left="";evs(p).forEach(function(e){

  return {st:st,deacon:dk,joined:joined,left:left,active:st==="member"||st==="note"}}
function addMonths(iso,n){var p=iso.split("-").map(Number),d=new Date(p[0],p[1]-1+n,1),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(p[2],last));return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

  var R={noteDue:[],noteSoon:[],noteNo:[],excl:[],off:[]};
  all().forEach(function(x){
    if(x.d.st==="note"){var e=lastEv(x.p,"note_on");if(!e||!e.until)R.noteNo.push({x:x,e:e});else if(e.until<=t)R.noteDue.push({x:x,e:e});else if(e.until<=soon)R.noteSoon.push({x:x,e:e})}

    doc:function(p){var q=p.split("/");return wd(real.doc(p),q[0],q[1])}}}

  else if(a==="saveContact"){var pc=person(S.card),bc=body(pc),by=val("c_by");try{localStorage.setItem("me",by)}catch(e){}bc.contacts=(bc.contacts||[]).concat([{date:val("c_date")||today(),kind:val("c_kind"),by:by,note:val("c_note")}]);save(pc.id,bc).then(function(){S.mode="";toast("Контакт записано");renderDlg()},function(){})}
  else if(a==="delContact"){var ci=+t.dataset.i;if(S.confirm!==1000+ci){S.confirm=1000+ci;return renderDlg()}var pd=person(S.card),bd2=body(pd);bd2.contacts.splice(ci,1);S.confirm=-1;save(pd.id,bd2).then(function(){toast("Контакт видалено")},function(){})}
  else if(a==="saveRel"){var p1=person(S.card),o1=person(val("r_pid")),ty=val("r_type");if(!o1)return toast("Виберіть людину зі списку");var b1=body(p1),bo=body(o1),sp=ty==="чоловік"||ty==="дружина";
    b1.rel=(b1.rel||[]).filter(function(r){return r.pid!==o1.id}).concat([{pid:o1.id,type:ty}]);bo.rel=(bo.rel||[]).filter(function(r){return r.pid!==p1.id}).concat([{pid:p1.id,type:invRel(ty,p1.sex)}]);if(sp){if(!b1.marital)b1.marital=MARITAL[0];if(!bo.marital)bo.marital=MARITAL[0]}
    save(p1.id,b1).then(function(){return save(o1.id,bo)}).then(function(){S.mode="";toast("Родича додано");renderDlg()},function(){})}
  else if(a==="delRel"){var p4=person(S.card),o4=person(t.dataset.id),b4=body(p4);b4.rel=(b4.rel||[]).filter(function(r){return r.pid!==t.dataset.id});save(p4.id,b4).then(function(){if(!o4)return;var bo4=body(o4);bo4.rel=(bo4.rel||[]).filter(function(r){return r.pid!==p4.id});return save(o4.id,bo4)}).then(function(){toast("Зв\'язок прибрано")},function(){})}
  else if(a==="add"){S.card=null;S.mode="new";renderDlg()}
  else if(a==="close")dlg.close();
  else if(a==="mode"){S.mode=t.dataset.m;S.confirm=-1;renderDlg()}
  else if(a==="dview"){S.dOpen=S.dView===v?!S.dOpen:true;S.dView=v;render()}
  else if(a==="dtoggle"){S.dOpen=!S.dOpen;render()}
  else if(a==="fstatus"){S.fStatus=v;S.fSub="";render()}
  else if(a==="fsub"){S.fSub=v;render()}
  else if(a==="fnote"){S.q="";S.fStatus="note";S.fDeacon="";S.fSpecial="";go("people")}
  else if(a==="special"){S.fSpecial=v;if(v){S.q="";S.fStatus="active";S.fDeacon=""}if(S.tab!=="people")go("people");else render()}
  else if(a==="toDeacon"){S.q="";S.fStatus="active";S.fSpecial="";S.fDeacon=v;go("people")}
  else if(a==="copy"){var txt=act().filter(function(x){return x.d.deacon===S.dView}).map(function(x,i){return (i+1)+". "+x.n+(x.p.phone?" — "+x.p.phone:"")+(x.p.address||x.p.place?" — "+[x.p.place,x.p.address].filter(Boolean).join(", "):"")}).join("\n");
    navigator.clipboard.writeText(S.dView+"\n"+txt).then(function(){toast("Список скопійовано")},function(){toast("Не вдалося скопіювати")})}
  else if(a==="addDeacon"){var np=person(val("newDeacon"));if(!np)return toast("Виберіть людину зі списку");var n=[np.last,np.first].filter(Boolean).join(" ");if(S.deacons.indexOf(n)>=0)return toast("Такий диякон уже є");saveDeacons(S.dk.concat([{pid:np.id,name:n,aliases:[]}])).then(function(){S.dView=n;toast("Диякона додано")},function(){})}
  else if(a==="delDeacon"){saveDeacons(S.dk.filter(function(x){return x.name!==S.dView})).then(function(){toast("Диякона прибрано")},function(){})}
  else if(a==="setPastor"){var sp=person(val("newPastor"));if(!sp)return toast("Виберіть людину зі списку");if(isPastor(sp.id))return toast("Цей пастор уже є у списку");saveDeacons(S.dk,S.pastors.concat([{pid:sp.id,name:[sp.last,sp.first].filter(Boolean).join(" ")}]).sort(function(a,b){return a.name.localeCompare(b.name,"uk")})).then(function(){toast("Пастора додано")},function(){})}
  else if(a==="delPastor"){saveDeacons(S.dk,S.pastors.filter(function(p){return p.pid!==t.dataset.id})).then(function(){toast("Пастора прибрано")},function(){})}
  else if(a==="saveNew"){var b=readForm();if(!b.last||!b.first)return toast("Вкажіть прізвище та ім\'я");var ev={date:val("f_adate")||today(),type:"accepted",how:val("f_how")};var dk=val("f_deacon");if(dk)ev.deacon=dk;b.events=[ev];var kd=val("f_kind");if(kd){b.kind=kd;b.events=dk?[{date:today(),type:"deacon",deacon:dk}]:[]}
    var ref=db.collection("people").doc();save(ref.id,b).then(function(){S.card=ref.id;S.mode="";toast("Картку створено");render();renderDlg()},function(){})}
  else if(a==="saveEdit"){var p=person(S.card),nb=Object.assign(body(p),readForm());if(document.getElementById("f_kind"))nb.kind=val("f_kind");if(!nb.last||!nb.first)return toast("Вкажіть прізвище та ім\'я");save(p.id,nb).then(function(){S.mode="";toast("Зміни збережено");renderDlg()},function(){})}
  else if(a==="saveEv"){var p2=person(S.card),b2=body(p2),m=S.mode,ev2={date:val("e_date")||today(),type:m==="exit"?val("e_type"):m};
    if(m==="deacon"){ev2.deacon=val("e_deacon");if(!ev2.deacon)return toast("Виберіть диякона")}
    if(m==="note_on"&&val("e_term"))ev2.until=addMonths(ev2.date,+val("e_term"));
    if(m==="accepted"){ev2.how=val("e_how");if(val("e_deacon"))ev2.deacon=val("e_deacon")}
    if(val("e_note"))ev2.note=val("e_note");var em=val("e_meet");if(em){var mm2=S.meetings.filter(function(z){return z.id===em})[0];if(mm2){ev2.meeting=em;ev2.date=mm2.date;if(ev2.until&&val("e_term"))ev2.until=addMonths(ev2.date,+val("e_term"))}}
    b2.events=(b2.events||[]).concat([ev2]);save(p2.id,b2).then(function(){S.mode="";toast("Записано в історію");renderDlg()},function(){})}
  else if(a==="delEv"){var i=+t.dataset.i;if(S.confirm!==i){S.confirm=i;return renderDlg()}var p3=person(S.card),b3=body(p3);b3.events.splice(i,1);S.confirm=-1;save(p3.id,b3).then(function(){toast("Подію видалено")},function(){})}
  else if(a==="delPerson"){if(S.confirm!==-2){S.confirm=-2;return renderDlg()}var id=S.card;dlg.close();db.collection("people").doc(id).delete().then(function(){toast("Картку видалено")},function(){toast("Не вдалося видалити")})}
});

function start(){
  var h=(location.hash||"").slice(1);if(TITLES[h])S.tab=h;
  try{var sr=JSON.parse(localStorage.getItem("rep")||"null");if(Array.isArray(sr))S.rep=sr.filter(function(k){return REPORTS.some(function(r){return r[0]===k})})}catch(e){}
  render();
  var use=window.claude&&window.claude.use?window.claude.use.bind(window.claude):function(){return Promise.resolve(null)};
  Promise.all([use("db"),use("user")]).then(function(r){
    rdb=r[0];var user=r[1];USER=user;db=rdb?wrapDb(rdb):null;
    if(!db){app.innerHTML='<div class="panel empty">Дані недоступні в цьому перегляді. Увійдіть у свій обліковий запис і відкрийте сторінку ще раз.</div>';return}
    if(user&&user.me)Promise.resolve(user.me()).then(function(m){S.me=m||null;S.uid=m&&m.id||null;S.isOwner=!!(m&&m.isOwner);S.isAdmin=!!(m&&(m.canEdit||m.isOwner));S.roleKnown=true;if(S.uid&&rdb)rdb.doc("log/"+S.uid).set({seen:Date.now()}).catch(function(){});if(S.isAdmin)subLog();render()});
    if(user&&user.can)Promise.resolve(user.can("data.write")).then(function(c){if(c===false){S.canWrite=false;render()}});
    db.collection("people").limit(1000).onSnapshot(function(snap){S.people=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});S.ready=true;render()},function(){app.innerHTML='<div class="panel empty">Не вдалося завантажити дані. Оновіть сторінку.</div>'});
    db.collection("groups").limit(500).onSnapshot(function(snap){S.groups=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});if(S.ready)render()},function(){});
    db.collection("meetings").limit(1000).onSnapshot(function(snap){S.meetings=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});if(S.ready)render()},function(){});
    db.collection("annual").limit(200).onSnapshot(function(snap){S.annual={};snap.docs.forEach(function(d){S.annual[d.id]=d.data()});if(S.ready)render()},function(){});
    db.collection("gmeet").limit(1000).onSnapshot(function(snap){S.gmeet=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});if(S.ready)render()},function(){});
    db.collection("archive").limit(200).onSnapshot(function(snap){S.archive={};snap.docs.forEach(function(d){S.archive[d.id]=d.data()});if(S.ready)render()},function(){});
    db.doc("config/main").onSnapshot(function(s){var c=s.exists?s.data():{};S.cfg=c;S.min={};Object.keys(c.ministries||{}).forEach(function(k){if(Array.isArray(c.ministries[k])&&c.ministries[k].length)S.min[k]=c.ministries[k].slice()});S.customRoles=Array.isArray(c.customRoles)?c.customRoles.slice():[];S.dk=(Array.isArray(c.deacons)?c.deacons:[]).map(function(d){return typeof d==="string"?{pid:"",name:d,aliases:[]}:{pid:d.pid||"",name:d.name,aliases:d.aliases||[]}});ALIAS={};S.dk.forEach(function(d){d.aliases.forEach(function(a){ALIAS[a]=d.name})});S.deacons=S.dk.map(function(d){return d.name});S.pastors=Array.isArray(c.pastors)?c.pastors.slice():(c.pastor?[c.pastor]:[]);if(S.ready)render()},function(){});
  });
}
start();
})();
</script>
